<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — CardápioGo</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/" style="justify-content:center;display:flex"><span class="logo-mark">🍔</span>CardápioGo</a>
    <h1>Defina uma nova senha</h1>
    <p class="sub">Escolha uma senha forte para sua conta.</p>
    <div class="err-box" id="err"></div>
    <form id="f">
      <div class="field"><label>Nova senha</label><input id="senha" type="password" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="btn">Redefinir senha</button>
    </form>
    <div class="auth-alt"><a href="/login.html">Voltar para o login</a></div>
  </div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Salvando…';
  const r = await fetch('/api/auth/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token, senha: senha.value }) });
  const d = await r.json();
  if (!r.ok){ document.getElementById('err').textContent=d.error; document.getElementById('err').classList.add('show'); btn.disabled=false; btn.textContent='Redefinir senha'; return; }
  location.href='/login.html';
});
</script>
</body>
</html>
