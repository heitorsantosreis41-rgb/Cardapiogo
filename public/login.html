<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — CardápioGo</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/" style="justify-content:center;display:flex"><span class="logo-mark">🍔</span>CardápioGo</a>
    <h1>Bem-vindo de volta 👋</h1>
    <p class="sub">Acesse seu painel para gerenciar seu cardápio.</p>
    <div class="err-box" id="err"></div>
    <form id="f">
      <div class="field"><label>E-mail</label><input id="email" type="email" placeholder="voce@restaurante.com" required></div>
      <div class="field"><label>Senha</label><input id="senha" type="password" placeholder="••••••••" required></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="btn">Entrar</button>
    </form>
    <div class="auth-alt"><a href="/forgot.html">Esqueci minha senha</a></div>
    <div class="auth-alt">Ainda não tem conta? <a href="/register.html">Criar conta grátis</a></div>
    <div class="auth-alt" style="border-top:1px solid var(--line);padding-top:14px;margin-top:20px">
      <button class="btn btn-secondary btn-sm" onclick="fillDemo()">Usar conta de demonstração</button>
      <div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px">demo@cardapiogo.com.br · demo123</div>
    </div>
  </div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Entrando…';
  const err = document.getElementById('err');
  const r = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: email.value, senha: senha.value }) });
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error; err.classList.add('show'); btn.disabled=false; btn.textContent='Entrar'; return; }
  location.href = '/app.html';
});
function fillDemo(){ document.getElementById('email').value='demo@cardapiogo.com.br'; document.getElementById('senha').value='demo123'; }
</script>
</body>
</html>
